name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify the web app before publishing
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Package the installable PWA bundle
        run: |
          cd docs/app
          zip -qr "../../khata-app-${GITHUB_REF_NAME}.zip" .

      # The keystore is a repository secret, never a file in the repo. If the
      # secret is missing the build stops here instead of shipping an unsigned
      # or debug-signed APK.
      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set - refusing to build an unsigned release"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/khata-release.p12
          test -s android/khata-release.p12

      - name: Build the signed release APK
        working-directory: android
        env:
          KEYSTORE_FILE: khata-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) VERSION="1.1.0" ;;
          esac
          CODE=$(printf '%s' "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          echo "Building Khata $VERSION (versionCode $CODE)"
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -PkhataVersionName="$VERSION" -PkhataVersionCode="$CODE"

      - name: Verify the APK is signed with the release key
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::release APK missing"; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -q "CN=Khata" /tmp/certs.txt || { echo "::error::APK is not signed with the Khata release key"; exit 1; }
          cp "$APK" "khata-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Khata ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            khata-${{ github.ref_name }}.apk
            khata-app-${{ github.ref_name }}.zip
          body: |
            Khata ${{ github.ref_name }} - offline-first udhar and jama ledger.

            **Android:** download `khata-${{ github.ref_name }}.apk` and install it. It is signed with the
            permanent Khata release key, so it installs straight over any earlier version and your ledger
            stays intact. The app also checks for updates itself: Settings > About > Check for updates.

            **Web / PWA:** open https://merry8989-uk.github.io/khata-pwa/app/ and use
            "Install app" / "Add to Home Screen". The attached zip is the same static bundle for
            self-hosting.

            **Cloud sync and SMS are optional.** Deploy `worker/` to your own Cloudflare account and
            paste the Worker URL plus token into Settings > General. The README has the exact commands.
